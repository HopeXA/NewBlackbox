name: Build BlackBox engine

on:
  workflow_dispatch: # run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Bcore is compiled with Java 21 (sourceCompatibility VERSION_21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # compileSdk 35 and NDK 29.0.13846066 come from the project's own build files
      - name: Install SDK platform and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      # Bcore (the engine) + black-reflection (a library that Bcore depends on at runtime)
      - name: Build engine libraries
        run: |
          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease :black-reflection:assemble --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp -v Bcore/build/outputs/aar/*.aar out/ || true
          cp -v black-reflection/build/outputs/aar/*.aar out/ || true
          cp -v black-reflection/build/libs/*.jar out/ || true
          echo "Collected:"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-outputs
          path: out
          
