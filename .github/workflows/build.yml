name: Build BlackBox engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform and NDK
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Build engine libraries
        run: |
          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease :black-reflection:assemble --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp -v Bcore/build/outputs/aar/*.aar out/ || true
          cp -v black-reflection/build/outputs/aar/*.aar out/ || true
          cp -v black-reflection/build/libs/*.jar out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: blackbox-outputs
          path: out
